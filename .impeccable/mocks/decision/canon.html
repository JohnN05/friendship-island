<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Game Show Standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:linear-gradient(160deg,#2a0b5e,#0b1f5e);font-family:Arial,sans-serif;color:#fff;position:relative}
h1{position:absolute;top:40px;width:100%;text-align:center;font-size:72px;font-weight:900;letter-spacing:.04em}
.timer{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:420px;height:150px;border-radius:24px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:110px;font-weight:900}
.row{position:absolute;left:80px;right:80px;top:350px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.p{height:440px;border-radius:28px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.p b{font-size:180px;font-weight:900}.p span{font-size:36px;font-weight:700}
.p.lead{border-color:#ffd43b;box-shadow:0 0 40px #ffd43b66}
</style></head><body>
<h1>FRIENDSHIP ISLAND</h1><div class="timer">03:00</div>
<div class="row"><div class="p"><span>🦩 Flamingos</span><b>14</b></div><div class="p lead"><span>🦞 Lobsters</span><b>21</b></div><div class="p"><span>🐬 Dolphins</span><b>17</b></div><div class="p"><span>🦭 Seals</span><b>09</b></div></div>
</body></html>
