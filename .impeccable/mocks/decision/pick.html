<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Variety Show Supers</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fff36b 0 18%,#ffd21f 18% 30%,#ff9fd0 30% 46%,#7ee0ff 46%);font-family:'Arial Rounded MT Bold','Arial Black',sans-serif;position:relative}
.title{position:absolute;left:50%;top:28px;transform:translateX(-50%) rotate(-3deg);font-size:92px;color:#fff;-webkit-text-stroke:6px #ff2d8f;paint-order:stroke;text-shadow:8px 8px 0 #4a2bd6;white-space:nowrap}
.burst{position:absolute;left:50%;top:190px;transform:translateX(-50%);width:420px;height:300px;background:#ff2d8f;clip-path:polygon(50% 0,60% 18%,82% 6%,78% 30%,100% 34%,84% 52%,98% 74%,74% 72%,70% 100%,52% 82%,32% 100%,28% 74%,2% 78%,16% 54%,0 32%,22% 28%,18% 4%,40% 18%);display:grid;place-items:center}
.burst span{font-size:150px;color:#fff;-webkit-text-stroke:8px #4a2bd6;paint-order:stroke}
.t{position:absolute;width:300px;height:250px;background:#fff;border:8px solid #4a2bd6;border-radius:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:12px 12px 0 #4a2bd6}
.t b{font-size:150px;color:#ff2d8f;-webkit-text-stroke:6px #4a2bd6;paint-order:stroke;line-height:1}
.t i{font-style:normal;font-size:30px;color:#4a2bd6}
.t1{left:60px;top:250px;transform:rotate(-5deg)}.t2{right:60px;top:250px;transform:rotate(4deg);background:#fff36b}
.t3{left:120px;top:580px;transform:rotate(3deg)}.t4{right:120px;top:580px;transform:rotate(-4deg)}
.crown{position:absolute;right:120px;top:190px;font-size:90px;transform:rotate(18deg)}
.sfx{position:absolute;left:560px;top:620px;font-size:80px;color:#fff;-webkit-text-stroke:5px #ff2d8f;paint-order:stroke;transform:rotate(-8deg)}
</style></head><body>
<div class="title">Friendship Island!!</div>
<div class="burst"><span>3:00</span></div>
<div class="t t1"><b>14</b><i>🦩 Fierce Flamingos</i></div>
<div class="t t2"><b>21</b><i>🦞 Lucky Lobsters</i></div><div class="crown">👑</div>
<div class="t t3"><b>17</b><i>🐬 Daring Dolphins</i></div>
<div class="t t4"><b>09</b><i>🦭 Snazzy Seals</i></div>
<div class="sfx">+10!!</div>
</body></html>
